# After each GitHub Pages deploy, tell IndexNow (Bing, Yandex, Seznam, Naver) which
# pages changed. Google doesn't use IndexNow; it reads the sitemap instead.
#
# "Changed" comes from data/page-state.json: the build stores a content hash for every
# page, so only pages whose content really changed (or are new) are sent.
# Needs indexnow_key in site.config.json; without it this does nothing.
name: indexnow

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: "Send every indexable page, not only the changed ones"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send changed URLs
        env:
          SEND_ALL: ${{ inputs.all && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.error, urllib.request
          from pathlib import Path

          cfg = json.loads(Path("site.config.json").read_text(encoding="utf-8"))
          key = cfg.get("indexnow_key") or ""
          if not key:
              print("::notice::indexnow_key is empty in site.config.json; nothing to send.")
              sys.exit(0)
          base = cfg["base_url"].rstrip("/") + "/"

          def state(rev):
              try:
                  raw = subprocess.run(["git", "show", f"{rev}:data/page-state.json"],
                                       capture_output=True, text=True, check=True).stdout
                  return json.loads(raw)
              except Exception:
                  return {}

          now = json.loads(Path("data/page-state.json").read_text(encoding="utf-8"))
          before = {} if os.environ["SEND_ALL"] == "true" else state("HEAD~1")
          paths = [p for p, s in now.items() if before.get(p, {}).get("hash") != s["hash"]]

          def indexable(path):
              f = Path("docs") / (path + "index.html" if path.endswith("/") or not path else path)
              if path == "404.html" or path.startswith("styleguide/") or not f.is_file():
                  return False
              text = f.read_text(encoding="utf-8")
              return 'content="noindex"' not in text and 'http-equiv="refresh"' not in text

          urls = [base + p for p in sorted(paths) if indexable(p)][:10000]
          if not urls:
              print("No changed pages to send.")
              sys.exit(0)
          print(f"Sending {len(urls)} URL(s):", *urls, sep="\n  ")
          body = json.dumps({"host": cfg["domain"], "key": key, "keyLocation": f"{base}{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, method="POST",
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  status = r.status
          except urllib.error.HTTPError as err:
              status = err.code
          print(f"IndexNow response: {status}")
          if status not in (200, 202):
              print(f"::error::IndexNow answered {status} (403 = key file not found, 422 = URLs not on this host).")
              sys.exit(1)
          PY
