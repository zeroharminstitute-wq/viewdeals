# Every night, move expired deals into data/archive.json and rebuild the site,
# so nothing expired stays up even if the daily curation task doesn't run.
name: nightly-prune

on:
  schedule:
    - cron: "7 5 * * *"   # 5:07 UTC, about midnight Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prune and rebuild
        run: python3 scripts/build.py --prune --today "$(TZ=America/New_York date +%F)"

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing expired today."
            exit 0
          fi
          day="$(TZ=America/New_York date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Nightly prune $day"
          # If the daily task pushed in the meantime, rebuild on top of its commit.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build.py --prune --today "$day"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Nightly prune $day"
              git push origin HEAD:main
            fi
          fi
